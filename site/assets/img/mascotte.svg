  <ellipse cx="200" cy="170" rx="92" ry="86" fill="#E8C08A"/>
  <ellipse cx="200" cy="218" rx="52" ry="40" fill="#F6E3C4"/>
  <!-- sunglasses -->
  <g>
    <rect x="118" y="138" width="72" height="46" rx="18" fill="#0B0B0B"/>
    <rect x="210" y="138" width="72" height="46" rx="18" fill="#0B0B0B"/>
    <rect x="186" y="150" width="28" height="9" rx="4" fill="#0B0B0B"/>
