  <path d="M110 128 C78 140 70 206 92 232 C110 224 122 186 132 152 Z" fill="#8E5C2C"/>
  <path d="M290 128 C322 140 330 206 308 232 C290 224 278 186 268 152 Z" fill="#8E5C2C"/>
